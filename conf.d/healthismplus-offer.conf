server {
	listen 80;
	listen 443 ssl;
	server_name idfcfirstbank.healthismplus.com
	index index.php;
	root /usr/share/nginx/html/php/healthismplus-offer;
	access_log /var/log/nginx/healthismplus-offer.access.log;
	error_log /var/log/nginx/healthismplus-offer.error.log;
	include global/app.conf;
	location ~* \.(eot|otf|ttf|woff)$ {
		add_header Access-Control-Allow-Origin *;
	}
	ssl_certificate /etc/letsencrypt/live/idfcfirstbank.healthismplus.com/fullchain.pem; # managed by Certbot
	ssl_certificate_key /etc/letsencrypt/live/idfcfirstbank.healthismplus.com/privkey.pem; # managed by Certbot
	include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
	ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}